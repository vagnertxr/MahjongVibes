name: Android

# The APK is built here rather than locally because the Android toolchain (JDK,
# SDK, Gradle) is a heavy thing to install just to cut a release. Pushing a
# v-tag publishes the APK; everything else just proves the build still works.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Copy the web app into the native project
        run: npm run sync

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK after the build
        id: apk
        run: |
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) version="${GITHUB_SHA::7}" ;;
          esac
          name="mahjong-vibes-${version}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
